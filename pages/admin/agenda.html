<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Administrativo - Casa dos Saberes</title>

  <!-- Ordem importa: variáveis primeiro, depois base, layout, componentes, agenda e painéis -->
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/admin/layout.css">
  <link rel="stylesheet" href="../../css/componentes.css">
  <link rel="stylesheet" href="../../css/admin/agenda.css">
  <link rel="stylesheet" href="../../css/admin/paineis.css">
  <link rel="stylesheet" href="../../css/admin/agenda-mobile.css">
  <link rel="stylesheet" href="../../css/admin/dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <link rel="stylesheet" href="../../css/padroes.css">
  <link rel="stylesheet" href="../../css/navbar.css">
  <script src="../../js/navbar.js" defer></script>
</head>

<body data-csa-interface class="csa-dashboard" data-somente-leitura="true">
  <csa-navbar area="admin" lateral=".csa-sidebar"></csa-navbar>

  <div class="csa-layout">

    <aside class="csa-sidebar">

      <img src="../../assets/cego-aderaldo.svg" alt="">
    </aside>

    <main class="csa-agenda">
      <h1 class="csa-titulo">Dashboard Administrativo</h1>
      <section class="csa-dashboard-indicadores" aria-label="Resumo de agendamentos da semana" aria-live="polite">
        <article class="csa-dashboard-card csa-dashboard-card--total">
          <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><rect x="6" y="8" width="28" height="28" rx="3"/><path d="M6 17h28M12 3v10M28 3v10"/></svg>
          <div><h2>Total de Agendamentos</h2><p id="csa-indicador-total" class="csa-dashboard-card__valor">—</p><p>nesta semana</p></div>
        </article>
        <article class="csa-dashboard-card csa-dashboard-card--pautas">
          <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round" aria-hidden="true"><path d="m12 4 23 20-4 5a5 5 0 0 0-6 7L3 17l4-5a5 5 0 0 0 5-8Z"/></svg>
          <div><h2>Sugestões de pauta</h2><p id="csa-indicador-pautas" class="csa-dashboard-card__valor">—</p><p>nesta semana</p></div>
        </article>
        <article class="csa-dashboard-card csa-dashboard-card--visitas">
          <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><g opacity=".4"><circle cx="10" cy="10" r="4"/><circle cx="30" cy="10" r="4"/><ellipse cx="9" cy="22" rx="7" ry="4"/><ellipse cx="31" cy="22" rx="7" ry="4"/></g><circle cx="20" cy="21" r="4"/><ellipse cx="20" cy="33" rx="7" ry="4"/></svg>
          <div><h2>Visitas Mediadas</h2><p id="csa-indicador-visitas" class="csa-dashboard-card__valor">—</p><p>nesta semana</p></div>
        </article>
        <article class="csa-dashboard-card csa-dashboard-card--pendentes">
          <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M17 6a3.5 3.5 0 0 1 6 0l13 24a3.5 3.5 0 0 1-3 5H7a3.5 3.5 0 0 1-3-5Z"/><path d="M20 15v8M20 29h0"/></svg>
          <div><h2>Pendentes</h2><p id="csa-indicador-pendentes" class="csa-dashboard-card__valor">—</p><p>nesta semana</p></div>
        </article>
      </section>
      <p id="csa-dashboard-aviso" class="csa-dashboard-aviso" role="status"></p>
      <h2 class="csa-dashboard-subtitulo" id="csa-agenda-secao">Agenda</h2>

      <div class="csa-barra-controle">
        <div class="csa-alternador">
          <button class="csa-btn-diaria" data-visao="diaria" aria-pressed="false">Diária</button>
          <button class="csa-btn-semanal csa-alternador__botao--ativo" data-visao="semanal" aria-pressed="true">Semanal</button>
        </div>

        <div class="csa-navegacao">
          <button class="csa-data-seta" data-direcao="-1" aria-label="Período anterior"><i class="fa-solid fa-angle-left"></i></button>
          <span class="csa-data" id="csa-data" aria-live="polite"><i class="fa-regular fa-calendar"></i>21 a 26 de setembro de 2026</span>
          <button class="csa-data-seta" data-direcao="1" aria-label="Próximo período"><i class="fa-solid fa-chevron-right"></i></button>
        </div>

        <select class="csa-filtro-status" id="csa-filtro-status" aria-label="Filtrar por tipo de registro">
          <option value="todos">Todos</option>
          <option value="pautas">Sugestões de pauta</option>
          <option value="visitas">Visitas mediadas</option>
        </select>

      </div>

      <ul class="csa-legenda">
        <li><span class="csa-item csa-item--aceito"></span>Aceito</li>
        <li><span class="csa-item csa-item--pendente"></span>Pendente</li>
      </ul>

      <div class="csa-dashboard-grade">
        <div class="csa-dashboard-calendario"><div id="csa-agenda" role="region" aria-label="Agenda por dia e turno" tabindex="0"></div></div>
        <aside id="csa-painel" class="csa-painel" hidden></aside>
      </div>
    </main>
  </div>

  <!-- Ordem importa: utilitários e dados primeiro -->
  <script src="../../js/agenda-modelo.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/visita-mediada/modelo.js"></script>
  <script src="../../js/admin/dados-api.js"></script>
  <script src="../../js/admin/dashboard.js"></script>
  <script src="../../js/admin/barra-controle.js"></script>
  <script src="../../js/admin/agenda.js"></script>
  <script src="../../js/admin/paineis.js"></script>
  <script src="../../js/admin/sessao-agenda.js"></script>
  <script src="../../js/admin/menu-mobile.js"></script>
  <script src="../../js/admin/diaria-mobile.js"></script>
  <script src="../../js/admin/semanal-mobile.js"></script>
</body>

</html>
