<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sugestões de Pauta - Casa dos Saberes</title>
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/admin/layout.css">
  <link rel="stylesheet" href="../../css/componentes.css">
  <link rel="stylesheet" href="../../css/admin/agenda.css">
  <link rel="stylesheet" href="../../css/admin/paineis.css">
  <link rel="stylesheet" href="../../css/admin/agenda-mobile.css">
  <link rel="stylesheet" href="../../css/admin/dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <link rel="stylesheet" href="../../css/padroes.css">
  <link rel="stylesheet" href="../../css/navbar.css">
  <script src="../../js/navbar.js" defer></script>
</head>
<body data-csa-interface class="csa-dashboard csa-pautas" data-somente-leitura="false">
  <csa-navbar area="admin" lateral=".csa-sidebar"></csa-navbar>
  <div class="csa-layout">
    <aside class="csa-sidebar"><img src="../../assets/cego-aderaldo.svg" alt=""></aside>
    <main class="csa-agenda">
      <h1 class="csa-titulo">Sugestões de Pauta</h1>
      <p id="csa-agenda-aviso" class="csa-dashboard-aviso" role="status"></p>
      <div class="csa-barra-controle">
        <div class="csa-alternador">
          <button class="csa-btn-diaria" data-visao="diaria" aria-pressed="false">Diária</button>
          <button class="csa-btn-semanal csa-alternador__botao--ativo" data-visao="semanal" aria-pressed="true">Semanal</button>
        </div>
        <div class="csa-navegacao">
          <button class="csa-data-seta" data-direcao="-1" aria-label="Período anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
          <span class="csa-data" id="csa-data" aria-live="polite"></span>
          <button class="csa-data-seta" data-direcao="1" aria-label="Próximo período"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
        </div>
        <select class="csa-filtro-status" id="csa-filtro-status" aria-label="Filtrar por status">
          <option value="todos">Status: Todos</option>
          <option value="aceito">Status: Aceito</option>
          <option value="pendente">Status: Pendente</option>
          <option value="negado">Status: Negado</option>
          <option value="cancelado">Status: Cancelado</option>
        </select>
        <button class="csa-btn-pdf csa-exportar-pdf" id="csa-btn-pdf" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M14 2H5v20h14V7ZM14 2v5h5"/><path d="M7 17v-5h2a1.5 1.5 0 0 1 0 3H7m5 2v-5h1a2.5 2.5 0 0 1 0 5Zm5 0v-5h3m-3 2h2"/></svg><span>Exportar PDF</span></button>
      </div>
      <ul class="csa-legenda">
        <li><span class="csa-item csa-item--aceito"></span>Aceito</li>
        <li><span class="csa-item csa-item--pendente"></span>Pendente</li>
        <li><span class="csa-item csa-item--disponivel"></span>Disponível</li>
      </ul>
      <div class="csa-dashboard-grade">
        <div class="csa-dashboard-calendario"><div id="csa-agenda" role="region" aria-label="Agenda de eventos por dia e turno" tabindex="0"></div></div>
        <aside id="csa-painel" class="csa-painel" hidden></aside>
      </div>
    </main>
  </div>
  <script src="../../js/agenda-modelo.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/admin/dados-api.js"></script>
  <script src="../../js/admin/barra-controle.js"></script>
  <script src="../../js/admin/agenda.js"></script>
  <script src="../../js/admin/paineis.js"></script>
  <script src="../../js/admin/sessao-agenda.js"></script>
  <script src="../../js/admin/menu-mobile.js"></script>
  <script src="../../js/admin/diaria-mobile.js"></script>
  <script src="../../js/admin/semanal-mobile.js"></script>
</body>
</html>
