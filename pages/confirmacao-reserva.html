<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmação de reserva de espaços — Casa dos Saberes</title>
  <link rel="stylesheet" href="../css/confirmacao.css">
  <script src="../js/confirmacao-dados.js" defer></script>
  <script src="../js/confirmacao.js" defer></script>
</head>
<body class="csa-confirmacao csa-confirmacao--reserva" data-csa-tipo="reserva">
  <header class="csa-confirmacao-cabecalho">
    <div class="csa-confirmacao-topo">
      <img class="csa-confirmacao-logo" src="../assets/csca-gov.svg" alt="Casa dos Saberes e Governo do Ceará">
      <details class="csa-confirmacao-menu">
        <summary aria-label="Abrir menu"><span></span><span></span><span></span></summary>
        <nav aria-label="Demonstrações">
          <a href="confirmacao-reserva.html?demo=1">Demonstração de reserva</a>
          <a href="confirmacao-visita.html?demo=1">Demonstração de visita</a>
        </nav>
      </details>
    </div>
    <div class="csa-confirmacao-faixa" aria-hidden="true"></div>
  </header>
  <main class="csa-confirmacao-conteudo">
    <button class="csa-confirmacao-voltar" type="button" data-csa-voltar>
      <span class="csa-confirmacao-seta" aria-hidden="true"><svg viewBox="0 0 36 36" fill="none"><path d="M19 6 7 18l12 12M8 18h23" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      Voltar para o formulário
    </button>
    <h1 id="csa-confirmacao-titulo">Confirme as Informações</h1>
    <section class="csa-confirmacao-estado" id="csa-confirmacao-estado" aria-live="polite" tabindex="-1">
      <h2>Nenhuma solicitação disponível</h2>
      <p>Não foi possível localizar os dados de uma solicitação enviada. Nenhum envio foi confirmado nesta página.</p>
      <a class="csa-confirmacao-exemplos" href="?demo=1">Visualizar demonstração com dados fictícios</a>
    </section>
    <div class="csa-confirmacao-grade" id="csa-confirmacao-grade" hidden></div>
    <noscript><p>Ative o JavaScript para visualizar o resumo. Nenhum envio é realizado por esta página.</p></noscript>
  </main>
</body>
</html>
