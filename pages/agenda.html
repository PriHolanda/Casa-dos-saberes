<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda Administrativa - Casa dos Saberes</title>

  <!-- Ordem importa: variáveis primeiro, depois base, layout, componentes, agenda e painéis -->
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/agenda.css">
  <link rel="stylesheet" href="../css/paineis.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>
  <header class="csa-header">
    <div class="csa-conteiner">
      <img src="../assets/csca-gov.svg" alt="Logo CSA e Governo do Ceara" class="csa-img-logo">
      <div class="csa-header-usuario">
        <span class="csa-perfil">AD</span>
        
        <div class="csa-user-content">
          <h3 class="csa-header-title">Admin</h3>
          <span class="csa-header-subtitle">Casa dos Saberes</span>
        </div>
        
        <i class="fa-solid fa-chevron-down"></i>
      </div>
    </div>
    <div class="csa-barra">
      <img src="../assets/barra1.svg" alt="">
      <img src="../assets/barra2.svg" alt="">
      <img src="../assets/barra3.svg" alt="">
      <img src="../assets/barra3.svg" alt="">
      <img src="../assets/barra3.svg" alt="">
      <img src="../assets/barra3.svg" alt="">
      <img src="../assets/barra3.svg" alt=""> 
    </div>
  </header>

  <div class="csa-layout">
    
    <aside class="csa-sidebar">
      <a href="#" class="csa-button-sidebar" ><i class="fa-regular fa-calendar"></i>Agenda</a>
      <img src="../assets/cego-aderaldo.svg" alt="">
    </aside>
    
    <main class="csa-agenda">
      <h1 class="csa-titulo">Agenda Administrativa</h1>

      <div class="csa-barra-controle">
        <div class="csa-alternador">
          <button class="csa-btn-diaria">Diária</button>
          <button class="csa-btn-semanal csa-btn-semanal--ativo">Semanal</button>
        </div>

        <div class="csa-navegacao">
          <button class="csa-data-seta" data-direcao="-1" ><i class="fa-solid fa-angle-left"></i></button>
          <span class="csa-data" id="csa-data"><i class="fa-regular fa-calendar"></i>21 a 27 de setembto de 2026</span>
          <button class="csa-data-seta" data-direcao="1"><i class="fa-solid fa-chevron-right"></i></button>
        </div>

        <select class="csa-filtro-status" id="csa-filtro-status">
          <option value="todos">Status: Todos</option>
          <option value="aceito">Status: Aceito</option>
          <option value="pendente">Status: Pendente</option>
        </select>

        <button id="csa-btn-pdf" class="csa-btn-pdf"><i class="fa-regular fa-file-pdf"></i>Exportar PDF</button>
      </div>
      
      <ul class="csa-legenda">
        <li><span class="csa-item csa-item--aceito"></span>Aceito</li>
        <li><span class="csa-item csa-item--pendente"></span>Pendente</li>
        <li><span class="csa-item csa-item--disponivel"></span>Disponível</li>
      </ul>
      
      <div id="csa-agenda"></div> <!-- T2 preenche aqui -->
    </main>
    
  </div>

    <aside id="csa-painel" class="csa-painel"></aside> <!-- T3 preenche aqui -->
  </div>

  <!-- Ordem importa: utilitários e dados primeiro -->
  <script src="../js/utilitarios.js"></script>
  <script src="../js/dados-exemplo.js"></script>
  <script src="../js/barra-controle.js"></script>
  <script src="../js/agenda.js"></script>
  <script src="../js/paineis.js"></script>
</body>

</html>
