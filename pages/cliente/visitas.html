<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda Casa de Saberes | Visita Mediada</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/cliente/visita.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" media="(min-width: 761px)">
  <script src="../../js/config.js" defer></script>
  <script src="../../js/api.js" defer></script>
  <script src="../../js/visitas-modelo.js" defer></script>
  <script src="../../js/visitas-api.js" defer></script>
  <script src="../../js/cliente/visita.js" defer></script>
  <script src="../../js/cliente/acessibilidade.js" defer></script>
</head>
<body class="csa-visita-publica" data-visita-pagina="agenda">
  <header class="csa-vp-header">
    <div class="csa-vp-topo">
      <a href="agenda-cliente.html" aria-label="Casa dos Saberes — agenda">
        <img src="../../assets/reservas/csca-gov.png" width="214" height="31" alt="Casa dos Saberes Cego Aderaldo e Governo do Ceará">
      </a>
      <details class="csa-vp-menu">
        <summary aria-label="Abrir menu"><img src="../../assets/reservas/menu.svg" width="41" height="27" alt=""></summary>
        <nav aria-label="Navegação principal">
          <a href="agenda-cliente.html">Agenda</a>
          <a href="visitas.html" data-visita-retorno>Visita Mediada</a>
          <a href="reservas.html">Formulário de reserva</a>
        </nav>
      </details>
    </div>
  </header>

  <section class="csa-vp-hero">
    <div><h1>Agenda Casa de Saberes</h1><p>Escolha seu espaço e solicite a sua visita mediada.</p></div>
    <div class="csa-vp-faixa" aria-hidden="true"></div>
  </section>
  <aside class="csa-vp-acessibilidade">
    <button class="csa-acessibilidade-btn" type="button" aria-label="Abrir menu de acessibilidade" aria-expanded="false" aria-controls="csa-acessibilidade-painel">
      <i class="fa-solid fa-universal-access" aria-hidden="true"></i>
    </button>
    <div class="csa-acessibilidade-painel" id="csa-acessibilidade-painel" hidden>
      <button type="button" data-acao="aumentar-fonte">A+ Aumentar fonte</button>
      <button type="button" data-acao="diminuir-fonte">A- Diminuir fonte</button>
      <button type="button" data-acao="contraste">Alto contraste</button>
      <button type="button" data-acao="sublinhar">Sublinhar links</button>
      <button type="button" data-acao="resetar">Restaurar padrão</button>
    </div>
  </aside>
  <div vw class="enabled csa-vp-libras">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div>
  </div>
  <main class="csa-vp-vitrine">
    <p class="csa-vp-vitrine__rotulo">Programação</p>
    <h2>Encontre um horário para você</h2>
    <div class="csa-vp-data">
      <button class="csa-vp-botao" id="csa-vp-escolher-dia" type="button"><span>Selecionar data</span><span>Escolher data</span></button>
      <input type="date" id="csa-vp-dia" aria-label="Selecionar data da visita">
      <div class="csa-vp-data__periodo">
        <button type="button" data-vp-dia="-1" aria-label="Dia anterior"><img src="../../assets/reservas/voltar.svg" width="24" height="24" alt=""></button>
        <time id="csa-vp-data-texto" aria-live="polite"></time>
        <button type="button" data-vp-dia="1" aria-label="Próximo dia"><img src="../../assets/reservas/voltar.svg" width="24" height="24" alt=""></button>
      </div>
    </div>
    <div class="csa-vp-vitrine__corpo">
      <div class="csa-vp-vitrine__grade" id="csa-vp-exposicoes" aria-live="polite"></div>
      <a class="csa-vp-botao" id="csa-vp-agendar" href="horarios-visita.html">Agendar visita</a>
    </div>
  </main>
</body>
</html>
