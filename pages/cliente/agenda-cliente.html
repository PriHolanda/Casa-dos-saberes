<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda</title>
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/componentes.css">
  <link rel="stylesheet" href="../../css/cliente/agenda-cliente.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <link rel="stylesheet" href="../../css/padroes.css">
  <link rel="stylesheet" href="../../css/navbar.css">
  <script src="../../js/navbar.js" defer></script>
</head>

<body data-csa-interface>
  <csa-navbar area="usuario"></csa-navbar>

  <img src="../../assets/cegoaderaldo-boneco.png" alt="cego aderaldo" class="csa-cegoaderaldo">
  <img src="../../assets/nave.png" alt="nave" class="csa-nave">
  <img src="../../assets/nave-left.png" alt="nave menor" class="csa-nave-left">
  <img src="../../assets/passaro.png" alt="passaro" class="csa-passaro">
  <img src="../../assets/casa.png" alt="casa" class="csa-casa">


  <aside class="csa-acessibilidade">
    <button class="csa-acessibilidade-btn" type="button" aria-label="Abrir menu de acessibilidade" aria-expanded="false"
      aria-controls="csa-acessibilidade-painel">
      <i class="fa-solid fa-universal-access"></i>
    </button>

    <div class="csa-acessibilidade-painel" id="csa-acessibilidade-painel" hidden>
      <button type="button" data-acao="aumentar-fonte">A+ Aumentar fonte</button>
      <button type="button" data-acao="diminuir-fonte">A- Diminuir fonte</button>
      <button type="button" data-acao="contraste">Alto contraste</button>
      <button type="button" data-acao="sublinhar">Sublinhar links</button>
      <button type="button" data-acao="resetar">Restaurar padrão</button>
    </div>
  </aside>

  <section class="csa-hero">
    <div class="csa-hero-content">
      <h1 class="csa-hero-title">Agenda Casa de Saberes</h1>
      <p class="csa-hero-text">
        Escolha um espaço, um turno e um horário livre, verifique a <br>
        disponibilidade visualizando a agenda.
      </p>
    </div>

    <div class="csa-barra">
      <img src="../../assets/barra1.svg" alt="">
      <img src="../../assets/barra2.svg" alt="">
      <img src="../../assets/barra3.svg" alt="">
      <img src="../../assets/barra3.svg" alt="">
      <img src="../../assets/barra3.svg" alt="">
      <img src="../../assets/barra3.svg" alt="">
      <img src="../../assets/barra3.svg" alt="">
    </div>
  </section>

  <main class="csa-agenda-cliente">
    <section class="csa-agenda">
      <h2 class="csa-agenda-kicker">Programação</h2>
      <span class="csa-agenda-title">Encontre um horário pra você</span>

      <div class="csa-period-date">
        <div class="csa-date-tools">
          <button class="csa-date-picker" type="button">Selecionar data</button>
          <input type="date" class="csa-date-input">

          <label class="csa-available-filter">
            <input type="checkbox" class="csa-available-checkbox">
            Somente horários para solicitar
          </label>
        </div>

        <div class="csa-date">
          <button class="csa-date-button" type="button"><i class="fa-solid fa-arrow-left"></i></button>
          <span class="csa-date-current"></span>
          <button class="csa-date-button" type="button"><i class="fa-solid fa-arrow-right"></i></button>
        </div>
      </div>

      <div class="csa-period-filter">
        <button class="csa-filter-btn csa-filter-active" type="button">Todos</button>
        <button class="csa-filter-btn" type="button">Manhã</button>
        <button class="csa-filter-btn" type="button">Tarde</button>
        <button class="csa-filter-btn" type="button">Noite</button>
      </div>

      <div class="csa-schedule">
        <p id="csa-programacao-mensagem" role="status">Carregando programação…</p>

        <!-- ================= MANHÃ ================= -->
        <section class="csa-period csa-period-morning">
          <header class="csa-period-header">
            <h3 class="csa-period-title">Manhã</h3>
            <span class="csa-period-time">Até 12:00</span>
          </header>

          <div class="csa-events"></div>
        </section>

        <!-- ================= TARDE ================= -->
        <section class="csa-period csa-period-afternoon">
          <header class="csa-period-header">
            <h3 class="csa-period-title">Tarde</h3>
            <span class="csa-period-time">12:00 às 18:00</span>
          </header>

          <div class="csa-events"></div>
        </section>

        <!-- ================= NOITE ================= -->
        <section class="csa-period csa-period-night">
          <header class="csa-period-header">
            <h3 class="csa-period-title">Noite</h3>
            <span class="csa-period-time">A partir das 18:00</span>
          </header>

          <div class="csa-events"></div>
        </section>

      </div>
    </section>
  </main>

  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>

  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>

<script src="../../js/cliente/acessibilidade.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/agenda-modelo.js"></script>
<script src="../../js/cliente/programacao.js"></script>
<script src="../../js/cliente/agenda-cliente.js"></script>

</body>

</html>
