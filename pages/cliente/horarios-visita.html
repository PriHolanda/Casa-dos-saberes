<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agende um horário | Casa dos Saberes</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/cliente/visita.css">
  <script src="../../js/config.js" defer></script>
  <script src="../../js/api.js" defer></script>
  <script src="../../js/visitas-modelo.js" defer></script>
  <script src="../../js/cliente/visita.js" defer></script>
</head>
<body class="csa-visita-publica" data-visita-pagina="horarios">
  <header class="csa-vp-header">
    <div class="csa-vp-topo">
      <a href="agenda-cliente.html" aria-label="Casa dos Saberes — agenda">
        <img src="../../assets/reservas/csca-gov.png" width="214" height="31" alt="Casa dos Saberes Cego Aderaldo e Governo do Ceará">
      </a>
      <details class="csa-vp-menu">
        <summary aria-label="Abrir menu"><img src="../../assets/reservas/menu.svg" width="41" height="27" alt=""></summary>
        <nav aria-label="Navegação principal">
          <a href="agenda-cliente.html">Agenda</a>
          <a href="visitas.html" data-visita-retorno>Visita Mediada</a>
          <a href="reservas.html">Formulário de reserva</a>
        </nav>
      </details>
    </div>
    <div class="csa-vp-faixa" aria-hidden="true"></div>
  </header>

  <main class="csa-vp-horarios">
    <a class="csa-vp-voltar" href="visitas.html" data-visita-retorno>
      <span><img src="../../assets/reservas/voltar.svg" width="24" height="24" alt=""></span> Voltar para agenda
    </a>
    <form class="csa-vp-horarios__painel" id="csa-vp-horarios">
      <div class="csa-vp-horarios__topo">
        <h1><span>Agende um horário</span><span>Formulário de visita</span></h1>
        <p>Duração da Exposição: 1 Hora</p>
      </div>
      <div class="csa-vp-horarios__opcoes" id="csa-vp-turnos"></div>
      <p class="csa-vp-aviso" id="csa-vp-aviso" role="status" hidden></p>
      <button class="csa-vp-botao" type="submit" disabled>Selecionar Horário</button>
    </form>
  </main>
</body>
</html>
