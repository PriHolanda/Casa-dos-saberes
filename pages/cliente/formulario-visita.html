<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulário de visita | Casa dos Saberes</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/cliente/visita.css">
  <script src="../../js/config.js" defer></script>
  <script src="../../js/api.js" defer></script>
  <script src="../../js/visitas-modelo.js" defer></script>
  <script src="../../js/visitas-api.js" defer></script>
  <script src="../../js/cliente/visita-solicitacao.js" defer></script>
  <script src="../../js/cliente/visita.js" defer></script>
</head>
<body class="csa-visita-publica" data-visita-pagina="formulario">
  <header class="csa-vp-header">
    <div class="csa-vp-topo">
      <a href="agenda-cliente.html" aria-label="Casa dos Saberes — agenda">
        <img src="../../assets/reservas/csca-gov.png" width="214" height="31" alt="Casa dos Saberes Cego Aderaldo e Governo do Ceará">
      </a>
      <details class="csa-vp-menu">
        <summary aria-label="Abrir menu"><img src="../../assets/reservas/menu.svg" width="41" height="27" alt=""></summary>
        <nav aria-label="Navegação principal">
          <a href="agenda-cliente.html">Agenda</a>
          <a href="visitas.html" data-visita-retorno>Visita Mediada</a>
          <a href="reservas.html">Formulário de reserva</a>
        </nav>
      </details>
    </div>
    <div class="csa-vp-faixa" aria-hidden="true"></div>
  </header>

  <main class="csa-vp-formulario">
    <a class="csa-vp-voltar" href="visitas.html" data-visita-retorno>
      <span><img src="../../assets/reservas/voltar.svg" width="24" height="24" alt=""></span> Voltar para agenda
    </a>
    <h1 id="csa-vp-formulario-titulo">Formulário de visita</h1>
    <p class="csa-vp-formulario__aviso"><strong>Importante:</strong> ao enviar sua solicitação, aguarde a confirmação da nossa equipe via telefone ou e-mail. O envio do formulário não significa que a reserva já foi confirmada.</p>
    <form id="csa-vp-formulario" aria-labelledby="csa-vp-formulario-titulo">
      <div class="csa-vp-perguntas" id="csa-vp-perguntas"></div>
      <noscript><p>Ative o JavaScript para preencher o formulário.</p></noscript>
      <p class="csa-vp-aviso" id="csa-vp-aviso" role="alert" tabindex="-1" hidden></p>
      <button class="csa-vp-botao" type="submit" disabled>Enviar formulário</button>
    </form>
  </main>
</body>
</html>
