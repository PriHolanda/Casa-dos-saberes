<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Solicite a reserva de um espaço na Casa dos Saberes Cego Aderaldo.">
  <title>Formulário de reserva | Casa dos Saberes</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
  <link rel="preload" href="../../assets/reservas/urbanist-variable.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/componentes.css">
  <link rel="stylesheet" href="../../css/cliente/reservas.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <link rel="stylesheet" href="../../css/cliente/header-publico.css">
  <script src="../../js/cliente/reservas-dados.js" defer></script>
  <script src="../../js/cliente/reservas-modelo.js" defer></script>
  <script src="../../js/cliente/reservas-perguntas/base.js" defer></script>
  <script src="../../js/cliente/reservas-perguntas/aberta.js" defer></script>
  <script src="../../js/cliente/reservas-perguntas/escolha.js" defer></script>
  <script src="../../js/cliente/reservas-perguntas/anexo.js" defer></script>
  <script src="../../js/cliente/reservas-perguntas/termo.js" defer></script>
  <script src="../../js/cliente/reservas-perguntas/registro.js" defer></script>
  <script src="../../js/cliente/reservas.js" defer></script>
  <script src="../../js/cliente/reservas-confirmacao.js" defer></script>
</head>

<body class="csa-reservas">
  <header class="csa-reservas-header">
    <div class="csa-reservas-header__conteudo csa-header-publico">
        <img src="../../assets/csca-gov.svg" alt="Casa dos Saberes Cego Aderaldo e Governo do Ceará" class="csa-img-logo csa-logo-publico">

      <button class="csa-reservas-menu__botao csa-menu-publico" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="csa-reservas-menu">
          <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>
      <nav class="csa-reservas-menu" id="csa-reservas-menu" aria-label="Navegação principal" hidden>
        <a href="agenda-cliente.html">Agenda</a>
        <a href="reservas.html" aria-current="page">Formulário de reserva</a>
      </nav>
    </div>
    <div class="csa-reservas-header__faixa" aria-hidden="true"></div>
  </header>

  <main class="csa-reservas__conteudo" id="csa-reservas-conteudo">
    <a class="csa-reservas__voltar" href="agenda-cliente.html">
      <span class="csa-reservas__seta"><img src="../../assets/reservas/voltar.svg" width="28" height="28" alt=""></span>
      <span>Voltar para agenda</span>
    </a>
    <h1 class="csa-reservas__titulo" id="csa-reservas-titulo">Formulário de reserva</h1>
    <p class="csa-reservas__aviso" id="csa-reservas-aviso"><strong>Importante:</strong> ao enviar sua solicitação, aguarde a confirmação da nossa equipe via telefone ou e-mail. O envio do formulário não significa que a reserva já foi confirmada.</p>

    <form id="csa-reservas-form" aria-labelledby="csa-reservas-titulo" aria-describedby="csa-reservas-aviso" novalidate>
      <div class="csa-reservas__colunas" id="csa-reservas-perguntas" aria-busy="true"></div>
      <noscript><p>Ative o JavaScript no navegador para preencher o formulário de reserva.</p></noscript>
      <div class="csa-reservas__acoes">
        <button class="csa-botao csa-botao--vermelho csa-reservas__enviar" type="submit" disabled>Enviar formulário</button>
        <p class="csa-reservas__mensagem" id="csa-reservas-mensagem" role="status" aria-live="polite" tabindex="-1" hidden></p>
      </div>
    </form>
  </main>
</body>
</html>
