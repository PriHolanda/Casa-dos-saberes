<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Componentes | Casa dos Saberes</title>
  <link rel="stylesheet" href="../css/variaveis.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>
  <h1>Componentes</h1>

  <section>
    <h2>Botões</h2>
    <div class="linha">
      <button class="csa-botao csa-botao--verde">Aprovar</button>
      <button class="csa-botao csa-botao--vermelho">Negar</button>
      <button class="csa-botao csa-botao--azul">Editar Evento</button>
    </div>
  </section>

  <section>
    <h2>Badges de status</h2>
    <div class="linha">
      <span class="csa-badge csa-badge--aceito"><i class="fa-solid fa-circle-check"></i>Aceito</span>
      <span class="csa-badge csa-badge--pendente"><i class="fa-solid fa-clock"></i>Pendente</span>
    </div>
  </section>

  <section>
    <h2>Campos</h2>
    <label class="csa-rotulo">Nome do Evento</label>
    <input class="csa-campo" placeholder="Ex: Campeonato de Farmar Aura ">

    <label class="csa-rotulo">Descrição</label>
    <textarea class="csa-campo"></textarea>
  </section>

  <section>
    <h2>Arquivo anexado</h2>
    <div class="csa-arquivo">
      <span>projeto_apresentacao.pdf<br>PDF 2,4 MB</span>
      <i class="fa-solid fa-download"></i>
    </div>
  </section>
</body>

</html>
