
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Informações sobre eventos da Casa dos Saberes Cego Aderaldo.">
  <title>Informações do evento | Casa dos Saberes</title>

  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="preload" href="../assets/reservas/urbanist-variable.ttf" as="font" type="font/ttf" crossorigin>

  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/detalhes.css">

  <script src="../js/config.js" defer></script>
  <script src="../js/api.js" defer></script>
  <script src="../js/agenda-modelo.js" defer></script>
  <script src="../js/detalhes-dados.js" defer></script>
  <script src="../js/detalhes-modelo.js" defer></script>
  <script src="../js/detalhes.js" defer></script>
</head>

<body class="csa-detalhes csa-detalhes--reserva" data-csa-tipo="reserva">
  <a class="csa-detalhes__pular" href="#csa-detalhes-conteudo">
    Ir para o conteúdo
  </a>

  <header class="csa-detalhes-header">
    <div class="csa-detalhes-header__conteudo">
      <a href="cliente/agenda-cliente.html" aria-label="Casa dos Saberes — agenda">
        <img
          src="../assets/reservas/csca-gov.png"
          width="214"
          height="31"
          alt="Casa dos Saberes Cego Aderaldo e Governo do Ceará"
        >
      </a>

      <button
        class="csa-detalhes-menu__botao"
        type="button"
        aria-label="Abrir menu"
        aria-expanded="false"
        aria-controls="csa-detalhes-menu"
      >
        <img src="../assets/reservas/menu.svg" width="41" height="27" alt="">
      </button>

      <nav
        class="csa-detalhes-menu"
        id="csa-detalhes-menu"
        aria-label="Navegação principal"
        hidden
      >
        <a href="cliente/agenda-cliente.html">Agenda</a>
        <a href="reservas.html">Formulário de reserva</a>
      </nav>
    </div>

    <div class="csa-detalhes-header__faixa" aria-hidden="true"></div>
  </header>

  <main class="csa-detalhes__conteudo" id="csa-detalhes-conteudo">
    <a class="csa-detalhes__voltar" href="cliente/agenda-cliente.html">
      <span class="csa-detalhes__seta" aria-hidden="true">
        <img src="../assets/reservas/voltar.svg" width="24" height="24" alt="">
      </span>
      <span>Voltar para a agenda</span>
    </a>

    <p
      class="csa-detalhes__mensagem"
      id="csa-detalhes-mensagem"
      role="status"
      aria-live="polite"
    >
      Carregando informações…
    </p>

    <div class="csa-detalhes__grade" id="csa-detalhes-grade" aria-busy="true" hidden>
      <article class="csa-detalhes-card csa-detalhes-card--principal">
        <p class="csa-detalhes-card__categoria" id="csa-detalhes-categoria"></p>

        <h1 class="csa-detalhes-card__titulo" id="csa-detalhes-titulo"></h1>

        <div class="csa-detalhes-card__metadados" id="csa-detalhes-metadados" hidden>
          <div
            class="csa-detalhes-card__metadado"
            id="csa-detalhes-data-container"
            hidden
          >
            <img
              src="../assets/detalhes-evento-visita/calendario-icon.svg"
              width="18"
              height="18"
              alt=""
            >
            <time id="csa-detalhes-data"></time>
          </div>

          <div
            class="csa-detalhes-card__metadado"
            id="csa-detalhes-horario-container"
            hidden
          >
            <img
              src="../assets/detalhes-evento-visita/relogio-icon.svg"
              width="18"
              height="18"
              alt=""
            >
            <time id="csa-detalhes-horario"></time>
          </div>
        </div>

        <section
          class="csa-detalhes-card__secao"
          id="csa-detalhes-descricao-secao"
          hidden
        >
          <h2 id="csa-detalhes-descricao-titulo">Sobre o evento</h2>
          <p id="csa-detalhes-descricao"></p>
        </section>

        <section
          class="csa-detalhes-card__secao"
          id="csa-detalhes-orientacoes-secao"
          hidden
        >
          <h2>Orientações</h2>
          <p id="csa-detalhes-orientacoes"></p>
        </section>

        <section
          class="csa-detalhes-card__secao"
          id="csa-detalhes-regras-secao"
          hidden
        >
          <h2>Regras de utilização</h2>
          <ul class="csa-detalhes-card__regras" id="csa-detalhes-regras"></ul>
        </section>
      </article>

      <aside
        class="csa-detalhes-card csa-detalhes-card--lateral"
        aria-labelledby="csa-detalhes-informacoes-titulo"
      >
        <h2 id="csa-detalhes-informacoes-titulo">Informações</h2>

        <dl class="csa-detalhes-card__lista">
          <div class="csa-detalhes-card__campo">
            <dt>Espaço</dt>
            <dd id="csa-detalhes-espaco"></dd>
          </div>

          <div
            class="csa-detalhes-card__campo"
            id="csa-detalhes-classificacao-container"
            hidden
          >
            <dt>Classificação indicativa</dt>
            <dd id="csa-detalhes-classificacao"></dd>
          </div>
        </dl>
      </aside>
    </div>

    <noscript>
      <p>Ative o JavaScript para visualizar as informações.</p>
    </noscript>
  </main>
</body>
</html>
