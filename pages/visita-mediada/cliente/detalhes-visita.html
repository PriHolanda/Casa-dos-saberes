
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Informações sobre visitas mediadas da Casa dos Saberes Cego Aderaldo.">
  <title>Informações da visita mediada | Casa dos Saberes</title>

  <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg">
  <link rel="preload" href="../../../assets/reservas/urbanist-variable.ttf" as="font" type="font/ttf" crossorigin>

  <link rel="stylesheet" href="../../../css/base.css">
  <link rel="stylesheet" href="../../../css/componentes.css">
  <link rel="stylesheet" href="../../../css/cliente/detalhes.css">
  <link rel="stylesheet" href="../../../css/visita-mediada/cliente/visita.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

  <script src="../../../js/navbar.js" defer></script>
  <script src="../../../js/config.js" defer></script>
  <script src="../../../js/api.js" defer></script>
  <script src="../../../js/agenda-modelo.js" defer></script>
  <script src="../../../js/cliente/detalhes-dados.js" defer></script>
  <script src="../../../js/cliente/detalhes-modelo.js" defer></script>
  <script src="../../../js/visita-mediada/modelo.js" defer></script>
  <script src="../../../js/cliente/detalhes.js" defer></script>
  <script src="../../../js/visita-mediada/cliente/visita.js" defer></script>
  <script src="../../../js/cliente/acessibilidade.js" defer></script>
  <link rel="stylesheet" href="../../../css/padroes.css">
  <link rel="stylesheet" href="../../../css/navbar.css">
</head>

<body data-csa-interface class="csa-detalhes csa-detalhes--visita csa-visita-publica" data-csa-tipo="visita">
  <a class="csa-detalhes__pular" href="#csa-detalhes-conteudo">
    Ir para o conteúdo
  </a>

  <csa-navbar area="usuario"></csa-navbar>

  <aside class="csa-vp-acessibilidade">
    <button class="csa-acessibilidade-btn" type="button" aria-label="Abrir menu de acessibilidade" aria-expanded="false" aria-controls="csa-acessibilidade-painel">
      <i class="fa-solid fa-universal-access" aria-hidden="true"></i>
    </button>
    <div class="csa-acessibilidade-painel" id="csa-acessibilidade-painel" hidden>
      <button type="button" data-acao="aumentar-fonte">A+ Aumentar fonte</button>
      <button type="button" data-acao="diminuir-fonte">A- Diminuir fonte</button>
      <button type="button" data-acao="contraste">Alto contraste</button>
      <button type="button" data-acao="sublinhar">Sublinhar links</button>
      <button type="button" data-acao="resetar">Restaurar padrão</button>
    </div>
  </aside>
  <div vw class="enabled csa-vp-libras">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div>
  </div>

  <main class="csa-detalhes__conteudo" id="csa-detalhes-conteudo">
    <a class="csa-detalhes__voltar csa-vp-voltar" href="visitas.html" data-visita-retorno>
      <span class="csa-detalhes__seta" aria-hidden="true">
        <img src="../../../assets/reservas/voltar.svg" width="28" height="28" alt="">
      </span>
      <span>Voltar para agenda</span>
    </a>

    <p
      class="csa-detalhes__mensagem"
      id="csa-detalhes-mensagem"
      role="status"
      aria-live="polite"
    >
      Carregando informações…
    </p>

    <div class="csa-detalhes__grade" id="csa-detalhes-grade" aria-busy="true" hidden>
      <article class="csa-detalhes-card csa-detalhes-card--principal">
        <p class="csa-detalhes-card__categoria" id="csa-detalhes-categoria"></p>

        <h1 class="csa-detalhes-card__titulo" id="csa-detalhes-titulo"></h1>

        <div class="csa-detalhes-card__metadados" id="csa-detalhes-metadados" hidden>
          <div
            class="csa-detalhes-card__metadado"
            id="csa-detalhes-data-container"
            hidden
          >
            <img
              src="../../../assets/detalhes-evento-visita/calendario-icon.svg"
              width="18"
              height="18"
              alt=""
            >
            <time id="csa-detalhes-data"></time>
          </div>

          <div
            class="csa-detalhes-card__metadado"
            id="csa-detalhes-horario-container"
            hidden
          >
            <img
              src="../../../assets/detalhes-evento-visita/relogio-icon.svg"
              width="18"
              height="18"
              alt=""
            >
            <time id="csa-detalhes-horario"></time>
          </div>
        </div>

        <section
          class="csa-detalhes-card__secao"
          id="csa-detalhes-descricao-secao"
          hidden
        >
          <h2 id="csa-detalhes-descricao-titulo">Sobre a visita</h2>
          <p id="csa-detalhes-descricao"></p>
        </section>

        <section
          class="csa-detalhes-card__secao"
          id="csa-detalhes-orientacoes-secao"
          hidden
        >
          <h2>Orientações</h2>
          <p id="csa-detalhes-orientacoes"></p>
        </section>

        <section
          class="csa-detalhes-card__secao"
          id="csa-detalhes-regras-secao"
          hidden
        >
          <h2>Regras da visita</h2>
          <ul class="csa-detalhes-card__regras" id="csa-detalhes-regras"></ul>
        </section>
      </article>

      <aside
        class="csa-detalhes-card csa-detalhes-card--lateral"
        aria-labelledby="csa-detalhes-informacoes-titulo"
      >
        <h2 id="csa-detalhes-informacoes-titulo">Informações</h2>

        <dl class="csa-detalhes-card__lista">
          <div class="csa-detalhes-card__campo">
            <dt>Espaço</dt>
            <dd id="csa-detalhes-espaco"></dd>
          </div>

          <div
            class="csa-detalhes-card__campo"
            id="csa-detalhes-classificacao-container"
            hidden
          >
            <dt>Classificação indicativa</dt>
            <dd id="csa-detalhes-classificacao"></dd>
          </div>
        </dl>
      </aside>
    </div>

    <noscript>
      <p>Ative o JavaScript para visualizar as informações.</p>
    </noscript>
  </main>
</body>
</html>
