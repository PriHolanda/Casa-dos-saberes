<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agende um horário | Casa dos Saberes</title>
  <link rel="icon" href="../../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../../css/base.css">
  <link rel="stylesheet" href="../../../css/visita-mediada/cliente/visita.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <link rel="stylesheet" href="../../../css/cliente/header-publico.css">
  <script src="../../../js/config.js" defer></script>
  <script src="../../../js/api.js" defer></script>
  <script src="../../../js/visita-mediada/modelo.js" defer></script>
  <script src="../../../js/visita-mediada/cliente/visita.js" defer></script>
  <script src="../../../js/cliente/acessibilidade.js" defer></script>
</head>
<body class="csa-visita-publica" data-visita-pagina="horarios">
  <header class="csa-vp-header">
    <div class="csa-vp-topo csa-header-publico">
      <a href="../../cliente/agenda-cliente.html" aria-label="Casa dos Saberes — agenda">
        <img class="csa-logo-publico" src="../../../assets/csca-gov.svg" alt="Casa dos Saberes Cego Aderaldo e Governo do Ceará">
      </a>
      <details class="csa-vp-menu csa-menu-publico">
        <summary aria-label="Abrir menu"><i class="fa-solid fa-bars" aria-hidden="true"></i></summary>
        <nav aria-label="Navegação principal">
          <a href="../../cliente/agenda-cliente.html">Agenda</a>
          <a href="visitas.html" data-visita-retorno>Visita Mediada</a>
          <a href="../../cliente/reservas.html">Formulário de reserva</a>
        </nav>
      </details>
    </div>
    <div class="csa-vp-faixa" aria-hidden="true">
      <img src="../../../assets/barra1.svg" alt="">
      <img src="../../../assets/barra2.svg" alt="">
      <img src="../../../assets/barra3.svg" alt="">
      <img src="../../../assets/barra3.svg" alt="">
      <img src="../../../assets/barra3.svg" alt="">
      <img src="../../../assets/barra3.svg" alt="">
      <img src="../../../assets/barra3.svg" alt="">
    </div>
  </header>

  <aside class="csa-vp-acessibilidade">
    <button class="csa-acessibilidade-btn" type="button" aria-label="Abrir menu de acessibilidade" aria-expanded="false" aria-controls="csa-acessibilidade-painel">
      <i class="fa-solid fa-universal-access" aria-hidden="true"></i>
    </button>
    <div class="csa-acessibilidade-painel" id="csa-acessibilidade-painel" hidden>
      <button type="button" data-acao="aumentar-fonte">A+ Aumentar fonte</button>
      <button type="button" data-acao="diminuir-fonte">A- Diminuir fonte</button>
      <button type="button" data-acao="contraste">Alto contraste</button>
      <button type="button" data-acao="sublinhar">Sublinhar links</button>
      <button type="button" data-acao="resetar">Restaurar padrão</button>
    </div>
  </aside>
  <div vw class="enabled csa-vp-libras">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div>
  </div>

  <main class="csa-vp-horarios">
    <a class="csa-vp-voltar" href="visitas.html" data-visita-retorno>
      <span><img src="../../../assets/reservas/voltar.svg" width="28" height="28" alt=""></span> Voltar para agenda
    </a>
    <form class="csa-vp-horarios__painel" id="csa-vp-horarios">
      <div class="csa-vp-horarios__topo">
        <h1><span>Agende um horário</span><span>Formulário de visita</span></h1>
        <p>Duração da Exposição: 1 Hora</p>
      </div>
      <div class="csa-vp-horarios__opcoes" id="csa-vp-turnos"></div>
      <p class="csa-vp-aviso" id="csa-vp-aviso" role="status" hidden></p>
      <button class="csa-vp-botao" type="submit" disabled>Selecionar Horário</button>
    </form>
  </main>
</body>
</html>
