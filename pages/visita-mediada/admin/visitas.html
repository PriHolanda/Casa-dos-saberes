<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visitas Mediadas | Casa dos Saberes</title>
  <link rel="icon" href="../../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../../css/base.css">
  <link rel="stylesheet" href="../../../css/admin/agenda.css">
  <link rel="stylesheet" href="../../../css/admin/agenda-mobile.css">
  <link rel="stylesheet" href="../../../css/admin/dashboard.css">
  <link rel="stylesheet" href="../../../css/visita-mediada/admin/visitas.css">
  <script src="../../../js/navbar.js" defer></script>
  <script src="../../../js/config.js" defer></script>
  <script src="../../../js/api.js" defer></script>
  <script src="../../../js/visita-mediada/modelo.js" defer></script>
  <script src="../../../js/visita-mediada/admin/visitas.js" defer></script>
  <script src="../../../js/admin/diaria-mobile.js" defer></script>
  <script src="../../../js/admin/semanal-mobile.js" defer></script>
  <link rel="stylesheet" href="../../../css/padroes.css">
  <link rel="stylesheet" href="../../../css/navbar.css">
</head>
<body data-csa-interface class="csa-visitas csa-dashboard">
  <csa-navbar area="admin" lateral=".csa-visitas-lateral"></csa-navbar>

  <div class="csa-visitas-admin">
    <aside class="csa-visitas-lateral">

      <img src="../../../assets/cego-aderaldo.svg" alt="">
    </aside>

    <main class="csa-visitas-lista">
      <h1>Visitas Mediadas</h1>
      <div class="csa-visitas-controles">
        <div class="csa-visitas-controles__tipos" role="group" aria-label="Visualização da agenda">
          <button type="button" data-visao="diaria" aria-pressed="true">Diária</button>
          <button type="button" data-visao="semanal" aria-pressed="false">Semanal</button>
        </div>
        <div class="csa-visitas-controles__periodo" role="group" aria-label="Período">
          <button type="button" data-direcao="-1" aria-label="Período anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
          <div class="csa-visitas-data" aria-live="polite">
            <span class="csa-visitas-calendario" aria-hidden="true"></span>
            <span id="csa-visitas-periodo"></span>
          </div>
          <button type="button" data-direcao="1" aria-label="Próximo período"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
        </div>
        <div class="csa-visitas-controles__acoes">
          <label class="csa-visitas-filtro">
            <span id="csa-visitas-filtro-texto" aria-hidden="true">Status: Todos</span>
            <select id="csa-visitas-filtro" aria-label="Filtrar por status">
              <option value="todos">Status: Todos</option>
              <option value="aprovada">Status: Aceito</option>
              <option value="pendente">Status: Pendente</option>
              <option value="negada">Status: Negada</option>
              <option value="cancelada">Status: Cancelada</option>
              <option value="desconhecido">Status: Desconhecido</option>
            </select>
          </label>
          <button class="csa-exportar-pdf" id="csa-visitas-exportar" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M14 2H5v20h14V7ZM14 2v5h5"/><path d="M7 17v-5h2a1.5 1.5 0 0 1 0 3H7m5 2v-5h1a2.5 2.5 0 0 1 0 5Zm5 0v-5h3m-3 2h2"/></svg><span>Exportar PDF</span></button>
        </div>
      </div>
      <ul class="csa-visitas-legenda" aria-label="Status">
        <li><span class="csa-visitas-indicador" aria-hidden="true"></span>Aceito</li>
        <li><span class="csa-visitas-indicador csa-visitas-indicador--pendente" aria-hidden="true"></span>Pendente</li>
      </ul>
      <p class="csa-visitas-vazio" id="csa-visitas-mensagem" role="status">Carregando visitas…</p>
      <p class="csa-visitas-aviso" id="csa-visitas-exportacao-aviso" role="status" hidden></p>
      <div class="csa-dashboard-grade" id="csa-visitas-grade" hidden><div id="csa-agenda" role="region" aria-label="Agenda de visitas por dia e turno" tabindex="0"></div></div>
    </main>
  </div>

  <dialog class="csa-visita-detalhe" id="csa-visita-detalhe" aria-labelledby="csa-visita-detalhe-titulo">
    <div class="csa-visita-detalhe__painel">
      <div class="csa-visita-detalhe__cabecalho">
        <h2 id="csa-visita-detalhe-titulo"></h2>
        <button class="csa-visitas-botao csa-visita-detalhe__fechar" type="button" aria-label="Fechar detalhes">×</button>
      </div>
      <div class="csa-visita-detalhe__dados" id="csa-visita-detalhe-dados"></div>
      <div class="csa-visita-detalhe__acoes">
        <button class="csa-visitas-botao" type="button" data-acao="negar">Negar</button>
        <button class="csa-visitas-botao" type="button" data-acao="aprovar">Aprovar</button>
        <button class="csa-visitas-botao" type="button" data-acao="cancelar">Cancelar<span class="csa-visita-detalhe__cancelar-complemento"> visita</span></button>
      </div>
      <p class="csa-visitas-aviso" id="csa-visita-detalhe-aviso" role="status" hidden></p>
    </div>
  </dialog>
</body>
</html>
